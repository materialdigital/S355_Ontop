    po:
      - [a, obi:0000260] # a plan
      - [bfo:0000054, ex:tensile_test_$(id)] # realized in
      - [ro:0000059, ex:tensile_test_spec] # concretizes

  tensile-test-spec:
    sources:
      - query: |
          SELECT '' AS shared_id,
          'ASTM E 1875:2020' AS standard_name 

    s: ex:tensile_test_spec$(shared_id)

    po:
      - [a, iao:0000104] # a plan specification

      - p: pmd:0000006  # has value
        o: $(standard_name)
        datatype: xsd:string
