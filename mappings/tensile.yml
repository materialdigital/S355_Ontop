##################### First Measurement Process #####################
  measure-before-test:
    sources: 
      - table: tensile_data

    s: ex:measurement_process_pre_$(id)

    po:
      - [a, pmd:0000611] # a dimension measuring process
      - [bfo:0000199, ex:measurement_process_pre_temporal_region_$(id)] # occupies temporal region
      - [obi:0000293, ex:tensile_test_piece_$(id)] # has specified input
      - [obi:0000299, ex:thickness1_md_$(id)] # has specified output
      - [obi:0000299, ex:thickness2_md_$(id)] # has specified output
      - [obi:0000299, ex:thickness3_md_$(id)] # has specified output
      - [obi:0000299, ex:width1_md_$(id)] # has specified output
      - [obi:0000299, ex:width2_md_$(id)] # has specified output
      - [obi:0000299, ex:width3_md_$(id)] # has specified output
      - [obi:0000299, ex:original_gauge_length_md_$(id)] # has specified output
      - [ro:0009006, ex:thickness_$(id)] # assay measures characteristic
      - [ro:0009006, ex:width_$(id)] # assay measures characteristic
      - [ro:0009006, ex:original_gauge_length_$(id)] # assay measures characteristic
##################### Tensile Test #####################
  tensile-test:
    sources:
      - table: tensile_data

    s: ex:tensile_test_$(id)

    po:
      - [a, pmd:0000974] # a tensile testing process
      - [bfo:0000199, ex:tensile_test_temporal_region_$(id)] # occupies temporal region
      - [obi:0000293, ex:tensile_test_piece_$(id)] # has specified input
      - [obi:0000299, ex:maximum_force_md_$(id)] # has specified output
      - [obi:0000299, ex:force_UYS_md_$(id)] # has specified output
      - [ro:0009006, ex:maximum_force_$(id)] # assay measures characteristic
      - [ro:0009006, ex:force_UYS_$(id)] # assay measures characteristic
      # TODO: E-Modulus: output: the csv then some computing process that computes E-modulus from the data in the csv.
      
##################### Second Measurement Process #####################
  measure-after-test:
    sources: 
      - table: tensile_data

    s: ex:measurement_process_post_$(id)

    po:
      - [a, pmd:0000611] # a dimension measuring process 
      - [bfo:0000199, ex:measurement_process_post_temporal_region_$(id)] # occupies temporal region
      - [obi:0000293, ex:tensile_test_piece_after_test_$(id)] # has specified input
      - [obi:0000299, ex:elongated_gauge_length_md_$(id)] # has specified output
      - [obi:0000299, ex:final_thickness_md_$(id)] # has specified output
      - [obi:0000299, ex:final_width_md_$(id)] # has specified output
      - [ro:0009006, ex:elongated_gauge_length_$(id)] # assay measures characteristic
      - [ro:0009006, ex:final_thickness_$(id)] # assay measures characteristic
      - [ro:0009006, ex:final_width_$(id)] # assay measures characteristic
