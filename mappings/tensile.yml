    s: ex:measurement_process_pre_role_$(id)

    po:
      - [a, obi:0000067] # evaluant role
      - [ro:0000081, ex:tensile_test_piece_$(id)] # role of charpy test piece
      - [bfo:0000054, ex:measurement_process_pre_$(id)] # has realization

  tensile-test-piece-role:
    sources:
