prefixes:
  ex: "http://example.org/"
  obi: "http://purl.obolibrary.org/obo/OBI_"
  iao: "http://purl.obolibrary.org/obo/IAO_"  
  qudt: "http://qudt.org/vocab/unit/"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  pmd: "https://w3id.org/pmd/co/PMD_"
  ro: "http://purl.obolibrary.org/obo/RO_"
  bfo: "http://purl.obolibrary.org/obo/BFO_"
mappings:
######################### Test Piece #########################
  tensile-test-piece:
    sources:
      - table: tensile_data

    s: ex:tensile_test_piece_$(id)

    po:
      - [a, pmd:0000068] # a temporally qualified continuant
      - [pmd:0000070, ex:metal_$(metal_sheet)] # is state of
      - [bfo:0000108, ex:temporal_region_after_cutting_$(metal_sheet)] # exists at
      - [obi:0000312, ex:cutting_metal_$(metal_sheet)] # is specified output of
      - [ro:0001000, ex:metal_$(metal_sheet)] # derives from
      - [ro:0000086, ex:thickness_$(id)] # has quality
      - [ro:0000086, ex:width_$(id)] # has quality
      - [ro:0000086, ex:cross_section_area_mean_$(id)] # has quality (computed from the thickness and width values)
      - [ro:0000086, ex:original_gauge_length_$(id)] # has quality
      #- [ro:0000086, ex:elongated_gauge_length_$(id)] # has quality
      #- [ro:0000086, ex:final_thickness_$(id)] # has quality (a_u mm)
      #- [ro:0000086, ex:final_width_$(id)] # has quality (b_u mm)
      #- [ro:0000086, ex:min_cross_section_area_at_fracture_$(id)] # has quality (S_u mm2)
      #- [ro:0000086, ex:elongation_of_fracture_$(id)] # has quality (A_percent)
      #- [ro:0000086, ex:reduction_of_area_$(id)] # has quality (Z_percent)
      - [ro:0000086, ex:temperature_at_test_$(id)] # has quality (test_temp_c)
      - [ro:0000053, ex:force_UYS_$(id)] # has characteristic (F_eH kN) (Force Yield Strenght)
      - [ro:0000053, ex:maximum_force_$(id)] # has characteristic (F_M kN) (Maximum Force)
      - [ro:0000053, ex:upper_yield_strength_$(id)] # has characteristic // REH_MPA
      - [ro:0000053, ex:ultimate_tensile_strength_$(id)] # RM_MPA
      - [ro:0000053, ex:E_modulus_$(id)] # E_GPA

  tensile-test-piece-after:
    sources:
      - table: tensile_data

    s: ex:tensile_test_piece_after_test_$(id)

    po:
      - [a, pmd:0000068] # a temporally qualified continuant
      - [pmd:0000070, ex:metal_$(metal_sheet)] # is state of
      - [bfo:0000108, ex:measurement_process_post_temporal_region_$(id)] # exists at
      - [obi:0000312, ex:tensile_test_$(id)] # is specified output of
      - [ro:0001000, ex:tensile_test_piece_$(id)] # derives from
      - [ro:0000086, ex:elongated_gauge_length_$(id)] # has quality
      - [ro:0000086, ex:final_thickness_$(id)] # has quality (a_u mm)
      - [ro:0000086, ex:final_width_$(id)] # has quality (b_u mm)
      - [ro:0000086, ex:min_cross_section_area_at_fracture_$(id)] # has quality (S_u mm2)
      - [ro:0000086, ex:elongation_of_fracture_$(id)] # has quality (A_percent)
      - [ro:0000086, ex:reduction_of_area_$(id)] # has quality (Z_percent)

############### [NOES] Longitudinal Direction #################
  tensile-longitudinal-direction:
    sources:
      - table: tensile_data

    s: ex:tensile_test_piece_long_dir_$(id)

    po:
      - [a, noes:0000031] # a longitudinal direction
      - [ro:0001015, ex:tensile_test_piece_$(id)] # location of
      - [pmd:0000077, ex:tensile_angle_to_rd_$(id)] # has relational quality

############### Information Content Entities #################
  tensile-id:
    sources:
      - table: tensile_data

    s: ex:tensile_id_$(id)

    po:
      - [a, iao:0020000] # a identifier
      - [iao:0000219, ex:tensile_test_piece_$(id)] # denotes

      - p: pmd:0000006 # has value
        o: $(id)
        datatype: xsd:string
######################### Qualities ##########################
  tensile-angle-to-rd:
    sources:
      - table: tensile_data

    s: ex:tensile_angle_to_rd_$(id)

    po:
      - [a, noes:0000160] # an angle to rolling direction
      - [pmd:0025999, ex:rolling_direction_$(metal_sheet)] # is relational quality of
      - [pmd:0000077, ex:svs_angle_to_rd_$(id)] # specified by value

  thickness:
    sources:
      - table: tensile_data

    s: ex:thickness_$(id)

    po:
      - [a, pmd:0050153] # a thickness
      - [ro:0000080, ex:tensile_test_piece_$(id)] # quality of tensile test piece x
      - [pmd:0000077, ex:svs_thickness_mean_$(id)] # specified by value svs 

  final-thickness:
    sources:
      - table: tensile_data

    s: ex:final_thickness_$(id)

    po:
      - [a, pmd:0050153] # a thickness
      - [ro:0000080, ex:tensile_test_piece_after_test_$(id)] # quality of tensile test piece x
      - [pmd:0000077, ex:svs_final_thickness_$(id)] # specified by value svs 

  width:
    sources:
      - table: tensile_data

    s: ex:width_$(id)

    po:
      - [a, pmd:0050154] # a width
      - [ro:0000080, ex:tensile_test_piece_$(id)] # quality of tensile test piece x
      - [pmd:0000077, ex:svs_width_mean_$(id)] # specified by value

  final-width:
    sources:
      - table: tensile_data

    s: ex:final_width_$(id)

    po:
      - [a, pmd:0050154] # a width
      - [ro:0000080, ex:tensile_test_piece_$(id)] # quality of tensile test piece x
      - [pmd:0000077, ex:svs_final_width_$(id)] # specified by value svs

  cross-section-area-mean:
    sources:
      - table: tensile_data

    s: ex:cross_section_area_mean_$(id)

    po:
      - [a, pmd:0000942] # a specific surface area (?)
      - [ro:0000080, ex:tensile_test_piece_$(id)] # quality of tensile test piece x
      - [pmd:0000077, ex:svs_cross_section_area_mean_$(id)] # specified by value svs

  min-cross-section-area-at-fracture:
    sources:
      - table: tensile_data

    s: ex:min_cross_section_area_at_fracture_$(id)

    po:
      - [a, pmd:0000942] # a specific surface area (?)
      - [ro:0000080, ex:tensile_test_piece_after_test_$(id)] # quality of tensile test piece x
      - [pmd:0000077, ex:svs_min_cross_section_area_at_fracture_$(id)] # specified by value svs

  original-gauge-length:
    sources:
      - table: tensile_data

    s: ex:original_gauge_length_$(id)

    po:
      - [a, pmd:0040001] # a length
      - [ro:0000080, ex:tensile_test_piece_$(id)] # quality of tensile test piece x
      - [pmd:0000077, ex:svs_original_gauge_length_$(id)] # specified by value svs

  elongated-gauge-length:
    sources:
      - table: tensile_data

    s: ex:elongated_gauge_length_$(id)

    po:
      - [a, pmd:0040001] # a length
      - [ro:0000080, ex:tensile_test_piece_after_test_$(id)] # quality of tensile test piece x
      - [pmd:0000077, ex:svs_elongated_gauge_length_$(id)] # specified by value svs

  elongation-of-fracture:
    sources:
      - table: tensile_data

    s: ex:elongation_of_fracture_$(id)

    po:
      - [a, pmd:0020101] # a proportion
      - [ro:0000080, ex:tensile_test_piece_after_test_$(id)] # quality of tensile test piece x
      - [pmd:0000077, ex:svs_elongation_of_fracture_$(id)] # specified by value svs

  reduction-of-area:
    sources:
      - table: tensile_data

    s: ex:reduction_of_area_$(id)

    po:
      - [a, pmd:0020101] # a proportion
      - [ro:0000080, ex:tensile_test_piece_after_test_$(id)] # quality of tensile test piece x
      - [pmd:0000077, ex:svs_reduction_of_area_$(id)] # specified by value svs

  temperatue-at-tensile-test:
      sources:
        - table: tensile_data

      s: ex:temperature_at_test_$(id)

      po:
        - [a, pmd:0000967] # a temperature
        - [ro:0000080, ex:tensile_test_piece_$(id)] # quality of
        - [pmd:0000077, ex:svs_temperature_at_test_$(id)] # specified by value
#################### Realizable entities #####################
  force-upper-yield-strength:
    sources:
      - table: tensile_data

    s: ex:force_UYS_$(id)

    po:
      - [a, pmd:0020200] # a force
      - [pmd:0000077, ex:svs_force_UYS_$(id)] # specified by value
      - [ro:0000052, ex:tensile_test_piece_$(id)] # characteristic of

  maximum-force:
    sources:
      - table: tensile_data

    s: ex:maximum_force_$(id)

    po:
      - [a, pmd:0020200] # a force
      - [pmd:0000077, ex:svs_maximum_force_$(id)] # specified by value
      - [ro:0000052, ex:tensile_test_piece_$(id)] # characteristic of

  upper-yield-strength:
    sources:
      - table: tensile_data

    s: ex:upper_yield_strength_$(id)

    po:
      - [a, pmd:0000952] # a strength
      - [pmd:0000077, ex:svs_upper_yield_strength_$(id)] # specified by value
      - [ro:0000052, ex:tensile_test_piece_$(id)] # characteristic of

  ultimate-tensile-strength:
    sources:
      - table: tensile_data

    s: ex:ultimate_tensile_strength_$(id)

    po:
      - [a, pmd:0000952] # a strength
      - [pmd:0000077, ex:svs_ultimate_tensile_strength_$(id)] # specified by value
      - [ro:0000052, ex:tensile_test_piece_$(id)] # characteristic of

  E-modulus:
    sources:
      - table: tensile_data

    s: ex:E_modulus_$(id)

    po:
      - [a, pmd:0000848] # a mechanical property
      - [pmd:0000077, ex:svs_e_modulus_$(id)] # specified by value
      - [ro:0000052, ex:tensile_test_piece_$(id)] # characteristic of

##################### Measurement Data #######################
  thickness1-measurement-datum:
    sources:
      - table: tensile_data

    s: ex:thickness1_md_$(id)

    po:
      - [a, iao:0000109] # measurement datum
      - [pmd:0000077, ex:svs_thickness1_$(id)] # specified by value
      - [iao:0000136, ex:thickness1_$(id)] # is about
      - [iao:0000136, ex:tensile_test_piece_$(id)] # is about

  thickness2-measurement-datum:
    sources:
      - table: tensile_data

    s: ex:thickness2_md_$(id)

    po:
      - [a, iao:0000109] # measurement datum
      - [pmd:0000077, ex:svs_thickness2_$(id)] # specified by value
      - [iao:0000136, ex:thickness_$(id)] # is about
      - [iao:0000136, ex:tensile_test_piece_$(id)] # is about

  thickness3-measurement-datum:
    sources:
      - table: tensile_data

    s: ex:thickness3_md_$(id)

    po:
      - [a, iao:0000109] # measurement datum
      - [pmd:0000077, ex:svs_thickness3_$(id)] # specified by value
      - [iao:0000136, ex:thickness_$(id)] # is about
      - [iao:0000136, ex:tensile_test_piece_$(id)] # is about

  width1-measurement-datum:
    sources:
      - table: tensile_data

    s: ex:width1_md_$(id)

    po:
      - [a, iao:0000109] # measurement datum
      - [pmd:0000077, ex:svs_width1_$(id)] # specified by value
      - [iao:0000136, ex:width_$(id)] # is about
