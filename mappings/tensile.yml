  width2-measurement-datum:
    sources:
      - table: tensile_data

    s: ex:width2_md_$(id)

    po:
      - [a, iao:0000109] # measurement datum
      - [pmd:0000077, ex:svs_width2_$(id)] # specified by value
      - [iao:0000136, ex:width_$(id)] # is about
      - [iao:0000136, ex:tensile_test_piece_$(id)] # is about

  width3-measurement-datum:
    sources:
      - table: tensile_data

    s: ex:width3_md_$(id)

    po:
      - [a, iao:0000109] # measurement datum
      - [pmd:0000077, ex:svs_width3_$(id)] # specified by value
      - [iao:0000136, ex:width_$(id)] # is about
      - [iao:0000136, ex:tensile_test_piece_$(id)] # is about

  original-gauge-length-measurement-datum:
    sources:
      - table: tensile_data

    s: ex:original_gauge_length_md_$(id)

    po:
      - [a, iao:0000109] # measurement datum
      - [pmd:0000077, ex:svs_original_gauge_length_$(id)] # specified by value
      - [iao:0000136, ex:original_gauge_length_$(id)] # is about
      - [iao:0000136, ex:tensile_test_piece_$(id)] # is about

  elongated-gauge-length-measurement-datum:
    sources:
      - table: tensile_data

    s: ex:elongated_gauge_length_md_$(id)

    po:
      - [a, iao:0000109] # measurement datum
      - [pmd:0000077, ex:svs_elongated_gauge_length_$(id)] # specified by value
      - [iao:0000136, ex:elongated_gauge_length_$(id)] # is about
      - [iao:0000136, ex:tensile_test_piece_after_test_$(id)] # is about

  final-thickness-measurement-datum:
    sources:
      - table: tensile_data

    s: ex:final_thickness_md_$(id)

    po:
      - [a, iao:0000109] # measurement datum
      - [pmd:0000077, ex:svs_final_thickness_$(id)] # specified by value
      - [iao:0000136, ex:final_thickness_$(id)] # is about
      - [iao:0000136, ex:tensile_test_piece_after_test_$(id)] # is about

  final-width-measurement-datum:
    sources:
      - table: tensile_data

    s: ex:final_width_md_$(id)

    po:
      - [a, iao:0000109] # measurement datum
      - [pmd:0000077, ex:svs_final_width_$(id)] # specified by value
      - [iao:0000136, ex:final_width_$(id)] # is about
      - [iao:0000136, ex:tensile_test_piece_after_test_$(id)] # is about

  force-UYS-measurment-datum:
    sources:
      - table: tensile_data

    s: ex:force_UYS_md_$(id)

    po:
      - [a, iao:0000109] # measurement datum
      - [pmd:0000077, ex:svs_force_UYS_$(id)] # specified by value
      - [iao:0000136, ex:force_UYS_$(id)] # is about
      - [iao:0000136, ex:tensile_test_piece_$(id)] # is about

  maximum-force-measurment-datum:
    sources:
      - table: sonic_resonance_data

    s: ex:maximum_force_md_$(id)

    po:
      - [a, iao:0000109] # measurement datum
      - [pmd:0000077, ex:svs_maximum_force_$(id)] # specified by value
      - [iao:0000136, ex:maximum_force_$(id)] # is about
      - [iao:0000136, ex:tensile_test_piece_$(id)] # is about
#################### Value specifications ####################
  tensile-angle-to-rd-value:
    sources:
      - table: tensile_data

    s: ex:svs_angle_to_rd_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(orientation)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:DEGREE~iri

  thickness1-value:
    sources:
      - table: tensile_data

    s: ex:svs_thickness1_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(d1_a1_mm)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:MilliM~iri

  thickness2-value:
    sources:
      - table: tensile_data

    s: ex:svs_thickness2_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(d2_a2_mm)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:MilliM~iri

  thickness3-value:
    sources:
      - table: tensile_data

    s: ex:svs_thickness3_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(d3_a3_mm)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:MilliM~iri

  final-thickness-value:
    sources:
      - table: tensile_data

    s: ex:svs_final_thickness_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(au_mm)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:MilliM~iri

  width1-value:
    sources:
      - table: tensile_data

    s: ex:svs_width1_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(b1_mm)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:MilliM~iri

  width2-value:
    sources:
      - table: tensile_data

    s: ex:svs_width2_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(b2_mm)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:MilliM~iri

  width3-value:
    sources:
      - table: tensile_data

    s: ex:svs_width3_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(b3_mm)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:MilliM~iri

  final-width-value:
    sources:
      - table: tensile_data

    s: ex:svs_final_width_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(bu_mm)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:MilliM~iri

  cross-section-area-mean-value:
    sources:
      - query: |
          SELECT
            id, (s1_mm2 + s2_mm2 + s3_mm2) / 3.0 AS avg_value
          FROM tensile_data

    s: ex:svs_cross_section_area_mean_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(avg_value)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:MilliM2~iri

  thickness-mean-value:
    sources:
      - query: |
          SELECT
            id, (d1_a1_mm + d2_a2_mm + d3_a3_mm) / 3.0 AS avg_value
          FROM tensile_data

    s: ex:svs_thickness_mean_$(id)

    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(avg_value)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:MilliM~iri

  width-mean-value:
    sources:
      - query: |
          SELECT
            id, (b1_mm + b2_mm + b3_mm) / 3.0 AS avg_value
          FROM tensile_data

    s: ex:svs_width_mean_$(id)

    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(avg_value)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:MilliM~iri

  min-cross-section-area-at-fracture-value:
    sources:
      - table: tensile_data

    s: ex:svs_min_cross_section_area_at_fracture_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(su_mm2)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:MilliM2~iri

  original-gauge-length-value:
    sources:
      - table: tensile_data

    s: ex:svs_original_gauge_length_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(l0_mm)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:MilliM~iri

  elongated-gauge-length-value:
    sources:
      - table: tensile_data

    s: ex:svs_elongated_gauge_length_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(lu_mm)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:MilliM~iri

  elongation-of-fracture-value:
    sources:
      - table: tensile_data

    s: ex:svs_elongation_of_fracture_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(a_percent)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:PERCENT

  reduction-of-area-value:
    sources:
      - table: tensile_data

    s: ex:svs_reduction_of_area_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(z_percent)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:PERCENT

  temperatue-at-tensile-test-value:
    sources:
      - table: tensile_data

    s: ex:svs_temperature_at_test_$(id)

    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(test_temp_C)
        datatype: xsd:float

      - p: iao:0000039 
        o: qudt:DEG_C~iri
  
  upper-yield-strength-value:
    sources:
      - table: tensile_data

    s: ex:svs_upper_yield_strength_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(reh_mpa)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:MegaPA~iri

  ultimate-tensile-strength-value:
    sources:
      - table: tensile_data

    s: ex:svs_ultimate_tensile_strength_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(rm_mpa)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:MegaPA~iri

  E-modulus-value:
    sources:
      - table: tensile_data

    s: ex:svs_e_modulus_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

