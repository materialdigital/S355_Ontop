##################### Measurement Data #######################
  sr-angle-to-rd-value:
    sources:
      - table: sonic_resonance_data

    s: ex:svs_angle_to_rd_$(id)
    
    po:
      - [a, obi:0001931] # scalar value specification

      - p: obi:0001937 # has specified numeric value
        o: $(orientation)
        datatype: xsd:float

      - p: iao:0000039 # has measurement unit label
        o: qudt:DEGREE~iri

  sr-Eigenfrequency-hk-measurment-datum:
    sources:
      - table: sonic_resonance_data

    s: ex:sr_eigenfreq_hk_md_$(id)

    po:
      - [a, iao:0000109] # measurement datum
      - [pmd:0000077, ex:svs_eigenfreq_hk_$(id)] # specified by value
      - [iao:0000136, ex:sr_eigenfreq_hk_$(id)] # is about
      - [iao:0000136, ex:sr_test_piece_$(id)] # is about

  sr-Eigenfrequency-fk-measurment-datum:
