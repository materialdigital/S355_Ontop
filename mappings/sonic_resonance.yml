prefixes:
  ex: "http://example.org/"
  obi: "http://purl.obolibrary.org/obo/OBI_"
  iao: "http://purl.obolibrary.org/obo/IAO_"  
  qudt: "http://qudt.org/vocab/unit/"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  pmd: "https://w3id.org/pmd/co/PMD_"
  ro: "http://purl.obolibrary.org/obo/RO_"
  bfo: "http://purl.obolibrary.org/obo/BFO_"
mappings:
######################### Test Piece #########################
  sr-test-piece:
    sources:
      - table: sonic_resonance_data

    s: ex:sr_test_piece_$(id)

    po:
      - [a, pmd:0000068] # a temporally qualified continuant
      - [pmd:0000070, ex:metal_$(metal_sheet)] # is state of
      - [bfo:0000108, ex:temporal_region_after_cutting_$(metal_sheet)] # exists at
      - [obi:0000312, ex:cutting_metal_$(metal_sheet)] # is specified output of
      - [iao:0000235, ex:sr_id_$(id)] # denoted by
      - [ro:0001000, ex:metal_$(metal_sheet)] # derives from
      - [ro:0000053, ex:sr_eigenfreq_hk_$(id)] # has characteristic
      - [ro:0000053, ex:sr_eigenfreq_fk_$(id)] 
      - [ro:0000053, ex:sr_eigenfreq_tors_$(id)]
      - [ro:0000053, ex:sr_E_hk_$(id)] 
      - [ro:0000053, ex:sr_E_fk_$(id)] 
      - [ro:0000053, ex:sr_E_$(id)] 
      - [ro:0000053, ex:sr_G_$(id)] 
      - [ro:0000053, ex:sr_poisson_ratio_fk_$(id)]
      - [ro:0000053, ex:sr_poisson_ratio_hk_$(id)]
      - [ro:0000053, ex:sr_poisson_ratio_$(id)] 
      - [ro:0000086, ex:sr_mass_$(id)] # has quality
      - [ro:0000086, ex:sr_length_$(id)]
      - [ro:0000086, ex:sr_width_$(id)]
      - [ro:0000086, ex:sr_height_$(id)]
      - [ro:0000086, ex:sr_density_$(id)]
############### [NOES] Longitudinal Direction #################
  sr-longitudinal-direction:
    sources:
      - table: sonic_resonance_data

    s: ex:sr_test_piece_long_dir_$(id)

    po:
      - [a, noes:0000031] # a longitudinal direction
      - [ro:0001015, ex:sr_test_piece_$(id)] # location of
      - [pmd:0000077, ex:sr_angle_to_rd_$(id)] # has relational quality
############### Information Content Entities #################
  sr-id:
    sources:
      - table: sonic_resonance_data

    s: ex:sr_id_$(id)

    po:
      - [a, iao:0020000] # a identifier
      - [iao:0000219, ex:sr_test_piece_$(id)] # denotes

      - p: pmd:0000006 # has value
        o: $(id)
        datatype: xsd:string
######################### Qualities #########################
  sr-angle-to-rd:
    sources:
      - table: sonic_resonance_data

    s: ex:sr_angle_to_rd_$(id)

    po:
      - [a, noes:0000160] # an angle to rolling direction
      - [pmd:0025999, ex:rolling_direction_$(metal_sheet)] # is relational quality of
      - [pmd:0000077, ex:svs_angle_to_rd_$(id)] # specified by value

  sr-mass:
    sources:
      - table: sonic_resonance_data

    s: ex:sr_mass_$(id)

    po:
      - [a, pmd:0020133] # a mass
      - [ro:0000080, ex:sr_test_piece_$(id)] # quality of sr test piece x
      - [pmd:0000077, ex:svs_mass_$(id)] # specified by value svs

  sr-length:
    sources:
      - table: sonic_resonance_data

    s: ex:sr_length_$(id)

    po:
      - [a, pmd:0040001] # a length
      - [ro:0000080, ex:sr_test_piece_$(id)] # quality of sr test piece x
      - [pmd:0000077, ex:svs_length_$(id)] # specified by value svs
  
  sr-width:
    sources:
      - table: sonic_resonance_data

    s: ex:sr_width_$(id)

    po:
      - [a, pmd:0050154] # a width (Breite)
      - [ro:0000080, ex:sr_test_piece_$(id)] # quality of sr test piece x
      - [pmd:0000077, ex:svs_width_$(id)] # specified by value svs

  sr-height:
    sources:
      - table: sonic_resonance_data

    s: ex:sr_height_$(id)

    po:
      - [a, pmd:0050153] # a Dicke
      - [ro:0000080, ex:sr_test_piece_$(id)] # quality of sr test piece x
      - [pmd:0000077, ex:svs_height_$(id)] # specified by value svs
  
  sr-density:
    sources:
      - table: sonic_resonance_data

    s: ex:sr_density_$(id)

    po:
      - [a, pmd:0000597] # a density
      - [ro:0000080, ex:sr_test_piece_$(id)] # quality of sr test piece x
      - [pmd:0000077, ex:svs_density_$(id)] # specified by value svs

