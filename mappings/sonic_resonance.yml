      - table: sonic_resonance_data

    s: ex:comp_proc_E_$(id)

    po:
      - [a, pmd:0025012] # analytical calculation
      - [obi:0000293, ex:svs_E_fk_$(id)] # has specified input
      - [obi:0000293, ex:svs_E_hk_$(id)] # has specified input
      - [obi:0000299, ex:svs_E_$(id)] # has specified output

  computing-process-G-modulus:
    sources:
      - table: sonic_resonance_data

    s: ex:comp_proc_G_$(id)

    po:
      - [a, pmd:0025012] # analytical calculation
      - [obi:0000293, ex:sr_eigenfreq_tors_md_$(id)] # has specified input
      - [obi:0000299, ex:svs_G_$(id)] # has specified output

  computing-process-poisson-ratio-hk:
    sources:
      - table: sonic_resonance_data

    s: ex:comp_proc_poisson_ratio_hk_$(id)

    po:
      - [a, pmd:0025012] # analytical calculation
      - [obi:0000293, ex:svs_G_$(id)] # has specified input
      - [obi:0000293, ex:svs_E_hk_$(id)] # has specified input
      - [obi:0000299, ex:svs_poisson_ratio_hk_$(id)] # has specified output

  computing-process-poisson-ratio-fk:
    sources:
      - table: sonic_resonance_data

    s: ex:comp_proc_poisson_ratio_fk_$(id)

    po:
      - [a, pmd:0025012] # analytical calculation
      - [obi:0000293, ex:svs_G_$(id)] # has specified input
      - [obi:0000293, ex:svs_E_fk_$(id)] # has specified input
      - [obi:0000299, ex:svs_poisson_ratio_fk_$(id)] # has specified output

  computing-process-poisson-ratio:
