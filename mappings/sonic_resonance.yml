#################### Temporal Regions #####################  
  sr-test-temporal-region:
    sources:
      - table: sonic_resonance_data

    s: ex:sr_test_temporal_region_$(id)

    po:
      - [a, bfo:0000008] # temporal region
      - [bfo:0000063, ex:comp_proc_E_fk_temporal_region_$(id)] # precedes
      - [bfo:0000063, ex:comp_proc_E_hk_temporal_region_$(id)] # precedes

  comp-proc-E-fk-temporal-region:
    sources:
      - table: sonic_resonance_data

    s: ex:comp_proc_E_fk_temporal_region_$(id)

    po:
      - [a, bfo:0000008] # temporal region
      - [bfo:0000062, ex:sr_test_temporal_region_$(id)] # preceded by
      - [bfo:0000063, ex:comp_proc_E_temporal_region_$(id)] # precedes
  
  comp-proc-E-hk-temporal-region:
    sources:
      - table: sonic_resonance_data

    s: ex:comp_proc_E_hk_temporal_region_$(id)

    po:
      - [a, bfo:0000008] # temporal region
      - [bfo:0000062, ex:sr_test_temporal_region_$(id)] # preceded by
      - [bfo:0000063, ex:comp_proc_E_temporal_region_$(id)] # precedes

