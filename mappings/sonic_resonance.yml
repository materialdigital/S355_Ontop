#################### Sonic Resonance Test ####################
  sr-test:
    sources:
      - table: sonic_resonance_data

    s: ex:sr_test_$(id)

    po:
      - [a, pmd:0000849] # a mechanical property analyzing process
      - [obi:0000293, ex:sr_test_piece_$(id)] # has specified input
      - [obi:0000299, ex:sr_eigenfreq_hk_md_$(id)] # has specified output
      - [obi:0000299, ex:sr_eigenfreq_fk_md_$(id)] # has specified output
      - [obi:0000299, ex:sr_eigenfreq_tors_md_$(id)] # has specified output
      - [ro:0009006, ex:sr_eigenfreq_hk_$(id)] # assay measures characteristic
      - [ro:0009006, ex:sr_eigenfreq_fk_$(id)] # assay measures characteristic
      - [ro:0009006, ex:sr_eigenfreq_tors_$(id)] # assay measures characteristic

################# Test Piece Role #################
  sr-test-piece-role:
    sources:
      - table: sonic_resonance_data

    s: ex:sr_test_piece_role_$(id)

    po:
      - [a, obi:0000067] # evaluant role
      - [ro:0000081, ex:sr_test_piece_$(id)] # role of charpy test piece
      - [bfo:0000054, ex:sr_test_$(id)] # has realization
      - [bfo:0000199, ex:sr_test_temporal_region_$(id)] # occupies temporal region
################## Plan and Spec ##################
  sr-test-plan:
    sources:
      - table: sonic_resonance_data

    s: ex:sr_test_plan_$(id)

    po:
      - [a, obi:0000260] # a plan
      - [bfo:0000054, ex:sr_test_$(id)] # realized in
      - [ro:0000059, ex:sr_test_spec] # concretizes

  sr-test-spec:
    sources:
      - query: |
          SELECT '' AS shared_id

    s: ex:sr_test_spec$(shared_id)

  sr-test-spec:
    sources:
      - query: |
          SELECT '' AS shared_id,
          'ASTM E 1875:2020' AS standard_name 

    s: ex:sr_test_spec$(shared_id)

    po:
      - [a, iao:0000104] # a plan specification

      - p: pmd:0000006  # has value
        o: $(standard_name)
        datatype: xsd:string

#################### Computing Processes #####################  
  computing-process-E-modulus-hk:
    sources:
      - table: sonic_resonance_data

    s: ex:comp_proc_E_hk_$(id)

    po:
      - [a, pmd:0025012] # analytical calculation
      - [obi:0000293, ex:sr_eigenfreq_hk_md_$(id)] # has specified input
      - [obi:0000299, ex:svs_E_hk_$(id)] # has specified output

  computing-process-E-modulus-fk:
    sources:
      - table: sonic_resonance_data

    s: ex:comp_proc_E_fk_$(id)

    po:
      - [a, pmd:0025012] # analytical calculation
      - [obi:0000293, ex:sr_eigenfreq_fk_md_$(id)] # has specified input
      - [obi:0000299, ex:svs_E_fk_$(id)] # has specified output

  computing-process-E-modulus-mw:
