      - [bfo:0000063, ex:comp_proc_poisson_ratio_hk_temporal_region_$(id)] # precedes
      - [bfo:0000063, ex:comp_proc_poisson_ratio_fk_temporal_region_$(id)] # precedes
      - [bfo:0000063, ex:comp_proc_poisson_ratio_temporal_region_$(id)] # precedes

  comp-proc-E-temporal-region:
    sources:
